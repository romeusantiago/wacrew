name: Imagem Docker (GHCR)

# Publica ghcr.io/sumioshi/wacrew, a imagem que o docker-compose.yml usa. Assim a VPS só
# baixa e sobe, sem compilar coletor e painel na própria máquina.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "web/**"
      - "patches/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  # Cada arquitetura compila na sua própria máquina (ARM nativo, sem emulação, que deixaria o
  # build do painel lento demais) e sobe só por digest; o job seguinte junta as duas sob as tags.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - plataforma: linux/amd64
            runner: ubuntu-latest
          - plataforma: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          labels: |
            org.opencontainers.image.title=WACrew
            org.opencontainers.image.description=Open-source WhatsApp AI agent: collector, panel and MCP server
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.plataforma }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGEM }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.plataforma }}
          cache-to: type=gha,mode=max,scope=${{ matrix.plataforma }}
      - name: Guardar o digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          # latest acompanha a main; tag v1.2.3 vira 1.2.3 e 1.2; sha-xxxxxxx para voltar atrás.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Juntar amd64 e arm64 sob as tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGEM }}@sha256:%s ' *)
      - name: Conferir
        run: docker buildx imagetools inspect ${{ env.IMAGEM }}:${{ steps.meta.outputs.version }}
